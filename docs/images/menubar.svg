<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="712" viewBox="0 0 1600 712" role="img" aria-labelledby="title desc">
<title id="title">메뉴 바에 작게 머무는 Localmark</title><desc id="desc">실제 SwiftUI 기능을 간추린 UI 예시입니다. 자동 수집과 플랫폼별 항목·주기, 데이터 폴더를 설정합니다. ego lite와 Chrome 중 브라우저를 선택할 수 있습니다.</desc>
<rect x="0" y="0" width="1600" height="712" rx="28" fill="#F7F8F2" stroke="none" />
<text x="72" y="72" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#247A63" letter-spacing="2">SMALL APP. QUIET ROUTINE.</text><text x="68" y="183" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="61" font-weight="600" fill="#183B34" >메뉴 바에</text><text x="68" y="263" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="61" font-weight="600" fill="#183B34" >작게 머물러요.</text><text x="72" y="333" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#647970" >모으는 일은 Localmark에 맡기고,</text><text x="72" y="375" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#647970" >좋아하는 글을 읽는 데 집중하세요.</text><g transform="translate(72 431) scale(1.0833333333333333)"><path d="M6 3h12v19l-6-4-6 4z" fill="none" stroke="#247A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="455" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#183B34" >플랫폼별로 모을 항목 선택</text><g transform="translate(72 486) scale(1.0833333333333333)"><path d="M12 7v6l4 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0" fill="none" stroke="#247A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="510" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#183B34" >내 리듬에 맞는 수집 주기</text><g transform="translate(72 541) scale(1.0833333333333333)"><path d="M3 6h6l2 3h10v11H3z" fill="none" stroke="#247A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="565" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#183B34" >원하는 데이터 폴더로 저장</text><rect x="769" y="34" width="759" height="644" rx="24" f