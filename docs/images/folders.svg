<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="490" viewBox="0 0 1600 490" role="img" aria-labelledby="title desc">
<title id="title">원시 배치, Markdown 문서, 내 메모</title><desc id="desc">raw/는 수집 배치 JSON, posts/는 플랫폼과 작성 연월별 Markdown, annotations/는 다시 수집해도 덮어쓰지 않는 내 메모 공간입니다.</desc>
<rect x="0" y="0" width="1600" height="490" rx="28" fill="#F7F8F2" stroke="none" />
<text x="64" y="61" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#247A63" letter-spacing="2">A PLACE FOR EVERYTHING</text><text x="64" y="116" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#183B34" >파일로 남기면, 쓰임은 자유로워져요.</text><path d="M550 161v290" fill="none" stroke="#D7E0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M1070 161v290" fill="none" stroke="#D7E0D5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="179" font-family="'SF Mono', Menlo, monospace" font-size="15" font-weight="500" fill="#647970" >01 / SOURCE</text><rect x="64" y="206" width="72" height="72" rx="18" fill="#E5EADF" stroke="none" /><g transform="translate(84 226) scale(1.3333333333333333)"><path d="M5 2h9l5 5v15H5z M14 2v6h5 M9 12h6 M9 16h6" fill="none" stroke="#247A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="159" y="253" font-family="'SF Mono', Menlo, monospace" font-size="32" font-weight="500" fill="#183B34" >raw/</text><text x="64" y="333" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" >수집 배치</text><text x="64" y="382" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#647970" >가져온 데이터를 JSON으로 보관해요.</text><text x="64" y="420" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#647970" >파일 이름은 SHA256 해시예요.</text><text x="596" y="179" font-family="'SF Mono', Menlo, monospace" font-size="15" font-weight="500" fill="#647970" >02 / LIBRARY</text><rect x="596" y="206" width="72" height="72" rx="18" fill="#BFE6D2" stroke="none" /><g transform="translate(616 226) scale(1.3333333333333333)"><path d="M3 6h6l2 3h10v11H3z" fill="none" stroke="#247A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="691" y="253" font-family="'SF Mono', Menlo, monospace" font-size="32" font-weight="500" fill="#183B34" >posts/</text><text x="596" y="333" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" >게시물별 Markdown</text><text x="596" y="382" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#647970" >플랫폼과 작성 연월별로 정리해요.</text><text x="596" y="420" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#647970" >Obsidian에서 바로 열 수 있어요.</text><text x="1116" y="179" font-family="'SF Mono', Menlo, monospace" font-size="15" font-weight="500" fill="#647970" >03 / YOUR NOTES</text><rect x="1116" y="206" width="72" height="72" rx="18" fill="#EBE7D8" stroke="none" /><g transform="translate(1136 226) scale(1.3333333333333333)"><path d="M5 3h14v18H5z M9 8h6 M9 12h6 M9 16h3" fill="none" stroke="#247A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1211" y="253" font-family="'SF Mono', Menlo, monospace" font-size="32" font-weight="500" fill="#183B34" >annotations/</text><text x="1116" y="333" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" >나만의 메모</text><text x="1116" y="382" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#647970" >모은 글과 내 생각을 따로 두세요.</text><text x="1116" y="420" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#647970" >다시 수집해도 덮어쓰지 않아요.</text>
</svg>